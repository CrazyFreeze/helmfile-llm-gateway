name: Validate & Security Check Helmfile

on:
  push:
    branches: [ main ]
    paths:
      - "bases/**"
      - "releases/**"
      - "helmfile.yaml*"
      - ".trivyignore.yaml"
      - ".github/workflows/validate-helmfile.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "bases/**"
      - "releases/**"
      - "helmfile.yaml*"
      - ".trivyignore.yaml"
      - ".github/workflows/validate-helmfile.yml"
  workflow_dispatch:

jobs:
  validate-helmfile:
    name: Validate & Render Helmfile Templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Install Helmfile & Kubeconform
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -sSL https://github.com/helmfile/helmfile/releases/download/v1.8.4/helmfile_1.8.4_linux_amd64.tar.gz | tar -xz -C "$HOME/.local/bin" helmfile
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar -xz -C "$HOME/.local/bin" kubeconform
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.8.0/kustomize_v5.8.0_linux_amd64.tar.gz | tar -xz -C "$HOME/.local/bin" kustomize

      - name: Prepare mock secrets for dry-run render
        run: |
          cp bases/private/minikube.example.yaml bases/private/minikube.yaml
          sed -i 's/CHANGE_ME/ci-mock-value/g' bases/private/minikube.yaml

      - name: Render Helmfile manifests (Dry-Run)
        run: |
          helmfile -e minikube repos
          helmfile -e minikube template --skip-tests > rendered.yaml
          echo "Manifests rendered successfully ($(wc -l < rendered.yaml) lines)"

      - name: Validate Kubernetes schemas (Kubeconform)
        run: |
          kubeconform -strict -ignore-missing-schemas -summary rendered.yaml

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scanners: 'misconfig,secret'
          scan-ref: 'rendered.yaml'
          trivyignores: '.trivyignore.yaml'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
